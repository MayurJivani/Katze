# Coolify on Jinx (FRC/DEPLOY.md). Host network: the app listens on 4331 like
# its old systemd unit did, so its Caddy block, Postgres URL and env file are unchanged.
services:
  katze:
    image: ghcr.io/mayurjivani/katze:latest
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    command: ["node", "apps/server/src/index.js"]
    env_file:
      - path: /etc/apps/katze.env
        required: false
    environment:
      NODE_ENV: "production"
      RELAY_PORT: "4331"
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
